{% extends "base.html" %}

{% block title %}Not Found - ERP System{% endblock %}

<div style="text-align: center; padding: 80px 20px;">

    <h1 style="font-size: 24px; margin-top: 16px;">Page Not Found</h1>

</div>
{% endblock %}
